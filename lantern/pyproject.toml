[project]
name = "lantern"
version = "0.1.0"
description = "Spotify for news: follow sources, get a weekly mix written by your local model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "feedparser>=6.0.11",
    "pyyaml>=6.0.2",
]

[project.scripts]
lantern = "lantern.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lantern"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
