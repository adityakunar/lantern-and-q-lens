# The weekly AI note. Edit the numbers to change how much you get.
id: ai-weekly
interests: [ai]
window_days: 7
lens: news
budget: 12          # most items in one note
max_stories: 6
max_quick_links: 6
per_source_cap: 3   # most items from one source
min_score: 4        # model score (0-10) an item needs to get in
output:
  type: obsidian
  folder: Lantern/AI news/Lantern
