# The weekly Security note. Edit the numbers to change how much you get.
id: security-weekly
interests: [security]
window_days: 7
lens: news
budget: 10          # most items in one note
max_stories: 5
max_quick_links: 6
per_source_cap: 3   # most items from one source
min_score: 5        # model score (0-10) an item needs to get in
output:
  type: obsidian
  folder: Lantern/Security/Lantern
