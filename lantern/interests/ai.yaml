  spotify_engineering:
    type: page
    index_url: https://engineering.atspotify.com/
    link_pattern: 'href="(/20[0-9]{2}/[0-9]{1,2}/[a-z0-9-]+)/?"'
    base_url: https://engineering.atspotify.com
    date_pattern: '([A-Z][a-z]{2,8} \d{1,2}, \d{4})'
