  aws_architecture:
    type: feed
    url: https://aws.amazon.com/blogs/architecture/feed/
    tags: [aws, architecture, ml-systems, distributed-systems]
    notes: ML-relevant architecture patterns. Verified 2026-09-21.

  cloudflare_ai:
