    notes: robots.txt wildcard allow; server-rendered. Verified 2026-09-21.
  spotify_research:
    type: page
    index_url: https://research.atspotify.com/publications
    link_pattern: 'href="(/publications/[a-z0-9-]+)/?"'
    base_url: https://research.atspotify.com
    date_pattern: '([A-Z][a-z]{2,8} \d{1,2}, \d{4})'
    tags: [spotify, research, publications, recommender-systems, audio-ml, personalization, generative-recommendations]
    notes: robots.txt wildcard allow; server-rendered. Verified 2026-09-21.
  netflix_tech:
    type: feed
    url: https://netflixtechblog.com/feed
    tags: [netflix, recsys, personalization, experimentation]
    notes: Recommender systems and experimentation beyond Spotify. Verified 2026-10-26.
  imec_aistack:
    type: feed
    url: https://aistack.imec-int.com/rss.xml
    tags: [imec, aistack, ml-systems, hardware, agents]
    notes: >-
      The site was rebuilt and now has a dated RSS feed; the old /blog/ directory listing
