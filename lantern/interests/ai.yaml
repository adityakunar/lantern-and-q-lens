      Narrower tags exist (workers-ai, ai-gateway, agents) if this is too broad. Verified 2026-10-29.

  # ── Payments ──────────────────────────────────────────────────────────────
  stripe_dev:
    type: feed
    url: https://stripe.dev/blog/feed
    tags: [stripe, payments, agents, fraud, fintech]
    notes: >-
      Stripe's developer blog, for the payment agent work: agent payments, Radar fraud ML,
      LLM fine-tuning for risk. Mostly API how-tos, which the keyword cut and judge weed out.
      Not stripe.com/blog, which is business news. Verified 2026-11-02.

