name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lantern:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lantern
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pytest -q
  q-lens:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: q-lens
    steps:
      - uses: actions/checkout@v4
      - run: python3 network/build-env.py --check
      - run: ./sync-shared.sh --check
  audit:
    # Known vulnerabilities in lantern/uv.lock (dev tools too), from the OSV database.
    # audit.yml runs the same check weekly, for advisories that appear without a code change.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lantern
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'  # uv audit needs a recent uv
      - run: uv audit --locked --preview-features audit-command
